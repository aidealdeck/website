# Rebuilds docs/ from src/ and commits the result.
# Runs once at 06:05 UTC on Dec 1, 2026 (00:05 Central), when sale.py flips to regular prices,
# and whenever you trigger it by hand from the Actions tab (Rebuild site > Run workflow).
# Delete this file if you would rather run `python3 build.py` and push by hand.
name: Rebuild site
on:
  schedule:
    - cron: "5 6 1 12 *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 build.py
      - name: Commit if anything changed
        run: |
          git config user.name "aidealdeck-bot"
          git config user.email "support@aidealdeck.com"
          git add -A docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild site ($(date -u +%Y-%m-%d)): prices and copy from sale.py"
          git push
