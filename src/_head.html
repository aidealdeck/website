/* Path tracking: tag every buy link with the page, the button position and the ad campaign that brought the visitor. */
(function(){
var page=({'/':'deck','/numbers/':'numbers','/free/':'free','/demo/':'demo','/faq/':'faq'})[location.pathname]||(location.pathname.indexOf('/cards/')===0?'card_'+location.pathname.split('/')[2]:'other');
var ad={};try{var q=new URLSearchParams(location.search);['utm_source','utm_campaign','utm_term'].forEach(function(k){var v=q.get(k);if(v)ad[k]=v.slice(0,80);});
 if(Object.keys(ad).length){sessionStorage.setItem('ad',JSON.stringify(ad));}else{ad=JSON.parse(sessionStorage.getItem('ad')||'{}');}
 if(!sessionStorage.getItem('land'))sessionStorage.setItem('land',page);}catch(e){}
var land=page;try{land=sessionStorage.getItem('land')||page;}catch(e){}
function pos(a){var m=[['.topbar','topbar'],['.nudge','nudge'],['.mbar','mobilebar'],['.leadband','leadband'],['.hero','hero'],['.cards','cardgrid'],['.offer','pricebox'],['.stack','deckgrid'],['.alt-buy','textlink']];for(var i=0;i<m.length;i++){if(a.closest(m[i][0]))return m[i][1];}return 'other';}
function tag(){document.querySelectorAll('a[data-buy]').forEach(function(a){try{var u=new URL(a.href);u.searchParams.set('utm_source',ad.utm_source||'direct');u.searchParams.set('utm_medium','site_'+land);u.searchParams.set('utm_campaign',ad.utm_campaign||'none');u.searchParams.set('utm_content',page+'_'+pos(a));a.href=u.toString();a.setAttribute('data-pos',pos(a));}catch(e){}});}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',tag);}else{tag();}

<script>
/* Behavior tracking (no recordings, no personal data): how long each section and card is on screen, hover time on cards, and how far people scroll. */
(function(){if(navigator.globalPrivacyControl||!('IntersectionObserver' in window))return;
document.addEventListener('DOMContentLoaded',function(){
var T={},vis={},H={},maxScroll=0,sent=false;
function name(el,i){if(el.classList.contains('pcard')){var h=el.querySelector('h3');return 'card: '+(h?h.textContent.trim().slice(0,40):i);}
var id=el.id||'';var h2=el.querySelector('h1,h2');return (id?id+': ':'')+(h2?h2.textContent.trim().slice(0,50):'section '+i);}
var els=[].slice.call(document.querySelectorAll('main > section, main .pcard, .leadband'));
var io=new IntersectionObserver(function(es){var now=Date.now();es.forEach(function(e){var k=e.target._k;if(e.isIntersecting&&e.intersectionRatio>=0.4){if(!vis[k])vis[k]=now;}else if(vis[k]){T[k]=(T[k]||0)+now-vis[k];vis[k]=0;}});},{threshold:[0,0.4,0.8]});
els.forEach(function(el,i){el._k=name(el,i);io.observe(el);
if(el.classList.contains('pcard')){var t0=0;el.addEventListener('mouseenter',function(){t0=Date.now();});el.addEventListener('mouseleave',function(){if(t0){H[el._k]=(H[el._k]||0)+Date.now()-t0;t0=0;}});}});
window.addEventListener('scroll',function(){var d=document.documentElement;var p=Math.round(100*(d.scrollTop+window.innerHeight)/d.scrollHeight);if(p>maxScroll)maxScroll=Math.min(p,100);},{passive:true});
function flush(){if(sent||!window.gtag)return;sent=true;var now=Date.now(),page=location.pathname;
Object.keys(vis).forEach(function(k){if(vis[k]){T[k]=(T[k]||0)+now-vis[k];vis[k]=0;}});
Object.keys(T).map(function(k){return [k,T[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,14).forEach(function(r){if(r[1]>=2000)gtag('event','section_time',{content_type:'section',content_id:r[0],content_group:page,value:Math.round(r[1]/1000)});});
Object.keys(H).forEach(function(k){if(H[k]>=1500)gtag('event','card_hover',{content_type:'card_hover',content_id:k,content_group:page,value:Math.round(H[k]/1000)});});
gtag('event','scroll_depth',{content_type:'scroll',content_id:page,content_group:page,value:maxScroll});}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush();});
window.addEventListener('pagehide',flush);
});})();
</script>
